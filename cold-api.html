<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cold API – Intelligent Prospecting Infrastructure</title>
  <meta name="description" content="Programmatic access to Cold’s LinkedIn-native outbound engine. Built for developers, growth teams, and platforms embedding true AI prospecting.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Enterprise Dark Palette */
      --bg: #030712;         /* Richer, deeper black/blue */
      --bg-surface: #0f172a; /* Slate 900 */
      --fg: #f8fafc;         /* Slate 50 */
      --fg-muted: #94a3b8;   /* Slate 400 */
      --border: #1e293b;     /* Slate 800 */
      --accent: #f59e0b;     /* Amber */
      --accent-glow: rgba(245, 158, 11, 0.15);
      --code-bg: #0d1117;
      
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius: 12px;
      --max-width: 1200px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg) 50%);
    }

    /* --- Typography Utilities --- */
    h1, h2, h3, h4 { margin: 0; letter-spacing: -0.02em; }
    
    h1 {
      font-size: 3.5rem;
      line-height: 1.1;
      font-weight: 700;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 { font-size: 2.25rem; font-weight: 600; margin-bottom: 1rem; }
    h3 { font-size: 1.25rem; font-weight: 500; color: #fff; }
    p { color: var(--fg-muted); font-size: 1.05rem; }
    
    a { color: var(--fg); text-decoration: none; transition: 0.2s; }
    a:hover { color: var(--accent); }

    /* --- Layout --- */
    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* --- Navigation --- */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(3, 7, 18, 0.7);
      backdrop-filter: blur(12px);
      padding: 1rem 0;
    }
    
    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links a {
      margin-left: 2rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--fg-muted);
    }
    .nav-links a:hover { color: #fff; }
    
    .nav-cta {
      background: rgba(255,255,255,0.1);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .nav-cta:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

    /* --- Hero Section --- */
    .hero {
      padding: 6rem 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .hero-content { max-width: 540px; }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(245, 158, 11, 0.1);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .hero-stats {
      margin-top: 2rem;
      display: flex;
      gap: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
    .stat strong { display: block; color: #fff; font-size: 1.2rem; }
    .stat span { font-size: 0.85rem; color: var(--fg-muted); }

    /* --- Code Snippet --- */
    .code-window {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5);
      overflow: hidden;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
      font-size: 0.85rem;
    }
    .code-header {
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
    .dot.red { background: #ef4444; }
    .dot.yellow { background: #f59e0b; }
    .dot.green { background: #22c55e; }
    
    .code-body { padding: 1.5rem; overflow-x: auto; color: #e2e8f0; }
    .c-k { color: #c678dd; } /* Keyword */
    .c-s { color: #98c379; } /* String */
    .c-f { color: #61afef; } /* Function */
    .c-c { color: #5c6370; font-style: italic; } /* Comment */

    /* --- Sections --- */
    .section { padding: 5rem 0; border-bottom: 1px solid var(--border); }
    
    /* NEW CLASS to replace inline styles */
    .feature-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }
    
    /* --- Grid Cards (Bento style) --- */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: #334155;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover::before { opacity: 1; }

    /* --- Feature List --- */
    .feature-list {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .feature-list li {
      display: flex;
      align-items: center;
      color: var(--fg-muted);
      font-size: 0.95rem;
    }
    .icon-check {
      color: var(--accent);
      margin-right: 0.75rem;
      background: rgba(245, 158, 11, 0.1);
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 12px;
    }

    /* --- FAQ --- */
    .faq-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }
    .faq-item h4 { color: #fff; margin-bottom: 0.5rem; }

    /* --- Footer --- */
    footer {
      padding: 4rem 0;
      text-align: center;
      color: var(--fg-muted);
      font-size: 0.9rem;
    }
    
    /* --- MOBILE OPTIMIZATION --- */
    @media (max-width: 768px) {
      .container { padding: 0 1.25rem; } /* Slightly tighter side padding */
      
      .hero { 
        grid-template-columns: 1fr; 
        padding: 3rem 0; 
        text-align: center;
        gap: 2rem;
      }
      
      .hero-stats { 
        justify-content: center; 
        flex-wrap: wrap; 
        gap: 1.5rem;
      }
      
      .nav-links { display: none; } /* Kept hidden as per your code */
      
      .code-window { 
        display: block; /* Kept visible but scaled down via CSS if needed */
        margin-top: 1rem;
      }
      
      h1 { font-size: 2.25rem; } /* Prevent header wrapping awkwardly */
      h2 { font-size: 1.75rem; }
      
      .section { padding: 3rem 0; }
      
      /* Forces the "Complete Control" section to stack vertically */
      .feature-split {
        grid-template-columns: 1fr !important;
        gap: 2.5rem !important;
      }
      
      .feature-list { grid-template-columns: 1fr; }
      .faq-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      
      /* Ensure code block in feature section doesn't overflow */
      pre { white-space: pre-wrap; word-wrap: break-word; }
    }
  </style>
</head>
<body>

    <div class="container nav-inner">

        <a href="mailto:partnerships@getcoldai.com" class="nav-cta">Request Access</a>
      </div>
    </div>
  </nav>

  <header class="container hero">
    <div class="hero-content">
      <div class="badge">API v2.0 Live</div>
      <h1>
